<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Bloom Matrix monogram">
  <defs>
    <linearGradient id="bmGrad" x1="0" y1="0" x2="240" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#101A3D" />
      <stop offset="50%" stop-color="#3D5AC2" />
      <stop offset="100%" stop-color="#5C7FE0" />
    </linearGradient>
  </defs>

  <!-- "B" stem -->
  <rect x="20" y="20" width="22" height="160" rx="3" fill="url(#bmGrad)" />
  <!-- "B" top bowl -->
  <path d="M42 20 H84 A37 37 0 0 1 84 94 H42 Z" fill="url(#bmGrad)" />
  <!-- "B" bottom bowl -->
  <path d="M42 94 H92 A43 43 0 0 1 92 180 H42 Z" fill="url(#bmGrad)" />

  <!-- "M" chevron -->
  <path
    d="M95 180 L140 45 L168 120 L195 45 L220 180"
    fill="none"
    stroke="url(#bmGrad)"
    stroke-width="22"
    stroke-linecap="square"
    stroke-linejoin="miter"
  />
</svg>
